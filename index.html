<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Kart Lap Calculator</title>
    <style>
        :root {
            --red: #E3001B;
            --blue: #0047BB;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --body-bg: #eef0f3;
            --input-bg: #ffffff;
        }

        body {
            font-family: 'Calibri', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            
            background-color: var(--body-bg);
            background-image: 
                linear-gradient(45deg, rgba(0,0,0,0.03) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.03) 75%, rgba(0,0,0,0.03)),
                linear-gradient(45deg, rgba(0,0,0,0.03) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.03) 75%, rgba(0,0,0,0.03));
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-dark);
        }

        .header-logo {
            max-width: 400px;
            width: 100%;
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.3));
            z-index: 10;
        }

        .calculator-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            border-top: 6px solid var(--red);
            border-bottom: 6px solid var(--blue);
            z-index: 10;
            font-family: 'Calibri', sans-serif;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: var(--text-dark);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.4em;
            font-family: 'Calibri', sans-serif;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: #555;
            font-family: 'Calibri', sans-serif;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 6px;
            font-size: 1.1em;
            box-sizing: border-box;
            font-family: 'Calibri', sans-serif;
            transition: border-color 0.2s;
            background-color: var(--input-bg);
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--blue);
        }

        .format-hint {
            font-size: 0.8em;
            color: #888;
            margin-top: 4px;
            display: block;
            font-family: 'Calibri', sans-serif;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s;
            margin-top: 10px;
            font-family: 'Calibri', sans-serif;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: #003691;
        }

        .button-row {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .btn-copy {
            background-color: #28a745;
            margin-top: 10px;
            display: none;
        }

        .btn-copy:hover {
            background-color: #218838;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 6px;
            text-align: center;
            border: 2px dashed #ccc;
            font-family: 'Calibri', sans-serif;
        }

        .result-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: bold;
            font-family: 'Calibri', sans-serif;
        }

        .result-time {
            font-size: 2.2em;
            font-weight: bold;
            color: var(--red);
            font-family: 'Calibri', sans-serif;
        }

        .comparison-diff {
            font-size: 0.95em;
            font-weight: bold;
            margin-top: 8px;
            font-family: 'Calibri', sans-serif;
        }

        .ghost-pace-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #eef2f7;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #d0d7de;
            font-size: 0.9em;
            display: none;
            font-family: 'Calibri', sans-serif;
        }

        .ghost-pace-title {
            font-weight: bold;
            color: #333;
            text-transform: uppercase;
            font-size: 0.8em;
            margin-bottom: 4px;
            font-family: 'Calibri', sans-serif;
        }

        .ghost-pace-val {
            font-family: 'Calibri', sans-serif;
            color: var(--blue);
            font-weight: bold;
            font-size: 1.2em;
        }

        .error {
            color: var(--red);
            font-size: 0.9em;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
            font-family: 'Calibri', sans-serif;
        }
    
        body.dark {
            --body-bg: #111;
            --card-bg: #1b1b1b;
            --text-dark: #f2f2f2;
            --input-bg: #2b2b2b;
            color: #f2f2f2;
            background-image:
                linear-gradient(45deg, #333 25%, transparent 25%, transparent 75%, #333 75%, #333),
                linear-gradient(45deg, #333 25%, transparent 25%, transparent 75%, #333 75%, #333);
        }
        body.dark label, body.dark .result-label, body.dark .ghost-pace-title, body.dark .format-hint, body.dark h2 { color: #f2f2f2; }
        body.dark input, body.dark select { color: #fff; border-color: #555; }
        body.dark .result-box { background: #252525; border-color: #555; }
        body.dark .ghost-pace-box { background: #30343a; border-color: #555; }
        body.dark .result-time { color: #ffd54a; }

    </style>
</head>
<body>

    <img src="image.png" alt="Mario Kart World Logo" class="header-logo">
    
    <button id="muteToggle" style="position:fixed;top:20px;left:20px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:none;border-radius:8px;background:#222;color:#fff;cursor:pointer;z-index:1000;font-size:1.2em;">🔊</button>
    <button id="themeToggle" style="position:fixed;top:20px;right:20px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:none;border-radius:8px;background:#222;color:#fff;cursor:pointer;z-index:1000;font-size:1.2em;">🌙</button>

    <audio id="bgMusic" src="sound.mp3" loop preload="auto"></audio>
    <audio id="calcAudio" src="play.mp3" preload="auto"></audio>
    <audio id="resetAudio" src="play.mp3" preload="auto"></audio>
    <audio id="copyAudio" src="play.mp3" preload="auto"></audio>

    <div class="calculator-card">
        <h2>Lap 3 Split Calculator</h2>
        
        <div class="input-group">
            <label for="trackSelect">World Record (Optional)</label>
            <select id="trackSelect" onchange="selectTrackRecord()">
                <option value="">-- Choose Track --</option>
                <option value="1:47.345|あつき">Mario Bros. Circuit (1'47"345 - あつき)</option>
                <option value="1:43.723|Jorge">Whistlestop Summit (1'43"723 - Jorge)</option>
                <option value="1:30.737|Jacob">Desert Hills (1'30"737 - Jacob)</option>
                <option value="1:50.363|Jojo">Shy Guy Bazaar (1'50"363 - Jojo)</option>
                <option value="1:59.882|Nugget">Wario Stadium (1'59"882 - Nugget)</option>
                <option value="1:53.991|LegoWiiMan">Airship Fortress (1'53"991 - LegoWiiMan)</option>
                <option value="1:57.865|Mikuel">DK Pass (1'57"865 - Mikuel)</option>
                <option value="2:09.606|Lean">Starview Peak (2'09"606 - Lean)</option>
                <option value="1:52.758|Optik">Sky-High Sundae (1'52"758 - Optik)</option>
                <option value="2:15.904|Another">Wario Shipyard (2'15"904 - Another)</option>
                <option value="1:54.734|James">Faraway Oasis (1'54"734 - James)</option>
                <option value="2:13.998|Jak">Peach Stadium (2'13"998 - Jak)</option>
                <option value="1:54.345|Optik">Salty Salty Speedway (1'54"345 - Optik)</option>
                <option value="1:44.207|Zae">Dino Dino Jungle (1'44"207 - Zae)</option>
                <option value="2:01.738|SpeZy">Great ? Block Ruins (2'01"738 - SpeZy)</option>
                <option value="1:53.881|flurry">Cheep Cheep Falls (1'53"881 - flurry)</option>
                <option value="2:17.067|Jak">Dandelion Depths (2'17"067 - Jak)</option>
                <option value="2:03.755|jBoneX">Boo Cinema (2'03"755 - jBoneX)</option>
                <option value="2:05.421|Chrin">Dry Bones Burnout (2'05"421 - Chrin)</option>
                <option value="1:53.159|Harpan">Moo Moo Meadows (1'53"159 - Harpan)</option>
                <option value="2:00.711|Another">Choco Mountain (2'00"711 - Another)</option>
                <option value="1:51.172|ありすがわ">Toad's Factory (1'51"172 - ありすがわ)</option>
                <option value="2:09.202|G-danzee">Bowser's Castle (2'09"202 - G-danzee)</option>
                <option value="1:56.986|Demon">Acorn Heights (1'56"986 - Demon)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="lap1">Lap 1 Split</label>
            <input type="text" inputmode="decimal" id="lap1" placeholder="00.000" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="lap2">Lap 2 Split</label>
            <input type="text" inputmode="decimal" id="lap2" placeholder="00.000" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="totalTime">Final Time</label>
            <input type="text" inputmode="decimal" id="totalTime" placeholder="0:00.000" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="targetTime">Target Time (Optional)</label>
            <input type="text" inputmode="decimal" id="targetTime" placeholder="0:00.000" autocomplete="off" oninput="updateGhostPace()">
    
        </div>

        <div class="button-row">
            <button onclick="calculateLap3()">Calculate</button>
            <button onclick="resetCalculator()" class="btn-secondary">Reset</button>
        </div>

        <div id="errorMessage" class="error">Please enter valid times for all fields.</div>

        <div class="result-box">
            <div class="result-label">Your Lap 3 Split</div>
            <div class="result-time" id="resultTime">--.---</div>
            <div class="comparison-diff" id="comparisonDiff"></div>
            
            <div class="ghost-pace-box" id="ghostPaceBox">
                <div class="ghost-pace-title">Required Lap 3 to Hit Target</div>
                <div class="ghost-pace-val" id="ghostPaceVal">--.---</div>
            </div>

            <button class="btn-copy" id="copyBtn" onclick="copySplits()">Copy Splits</button>
        </div>
    </div>

    <script>
        let lastCalculatedString = "";
        let lastCalcSoundTime = 0;
        let lastResetSoundTime = 0;
        let lastCopySoundTime = 0;

        function playCalcSound() {
            const now = Date.now();
            if (now - lastCalcSoundTime > 1000) {
                const audio = document.getElementById('calcAudio');
                if (audio) {
                    const soundClone = audio.cloneNode(true);
                    soundClone.play().catch(e => {});
                    lastCalcSoundTime = now;
                }
            }
        }

        function playResetSound() {
            const now = Date.now();
            if (now - lastResetSoundTime > 1000) {
                const audio = document.getElementById('resetAudio');
                if (audio) {
                    const soundClone = audio.cloneNode(true);
                    soundClone.play().catch(e => {});
                    lastResetSoundTime = now;
                }
            }
        }

        function playCopySound() {
            const now = Date.now();
            if (now - lastCopySoundTime > 1000) {
                const audio = document.getElementById('copyAudio');
                if (audio) {
                    const soundClone = audio.cloneNode(true);
                    soundClone.play().catch(e => {});
                    lastCopySoundTime = now;
                }
            }
        }

        function convertWrcToStandard(timeStr) {
            let clean = timeStr.replace(/'/g, ':').replace(/"/g, '.');
            return clean;
        }

        function parseTimeToMs(t) {
            t = t.trim();
            if (!t) return NaN;

            let m = 0;
            let rest = t;

            if (t.includes(':')) {
                const p = t.split(':');
                m = parseInt(p[0], 10);
                rest = p[1];
            }

            let s = 0;
            let ms = 0;
            
            if (rest.includes('.')) {
                const sp = rest.split('.');
                s = parseInt(sp[0], 10);
                
                let msText = sp[1];
                while(msText.length < 3) msText += '0';
                msText = msText.substring(0, 3);
                
                ms = parseInt(msText, 10);
            } else {
                s = parseInt(rest, 10);
            }

            if (isNaN(m) || isNaN(s) || isNaN(ms)) return NaN;

            return (m * 60 * 1000) + (s * 1000) + ms;
        }

        function formatMsToTime(msTotal, includeMinutes = true) {
            if (msTotal < 0) return "Invalid (Negative)";
            
            const m = Math.floor(msTotal / 60000);
            const rem = msTotal % 60000;
            const s = Math.floor(rem / 1000);
            const ms = rem % 1000;

            const sPad = s.toString().padStart(2, '0');
            const msPad = ms.toString().padStart(3, '0');

            if (m > 0 || includeMinutes) {
                return `${m}:${sPad}.${msPad}`;
            } else {
                return `${s}.${msPad}`; 
            }
        }

        function selectTrackRecord() {
            const select = document.getElementById('trackSelect');
            const val = select.value;
            if (!val) return;

            const [rawTime, holder] = val.split('|');
            const standardTime = convertWrcToStandard(rawTime);
            
            const wrMs = parseTimeToMs(standardTime);
            if (!isNaN(wrMs)) {
                const targetMs = wrMs - 1;
                document.getElementById('targetTime').value = formatMsToTime(targetMs, true);
                updateGhostPace();
            }
        }

        function updateGhostPace() {
            const l1Input = document.getElementById('lap1').value.trim();
            const l2Input = document.getElementById('lap2').value.trim();
            const targetInput = document.getElementById('targetTime').value.trim();
            const ghostBox = document.getElementById('ghostPaceBox');
            const ghostVal = document.getElementById('ghostPaceVal');

            const l1 = parseTimeToMs(l1Input);
            const l2 = parseTimeToMs(l2Input);
            const target = parseTimeToMs(targetInput);

            if (!isNaN(l1) && !isNaN(l2) && !isNaN(target)) {
                const requiredMs = target - (l1 + l2);
                if (requiredMs >= 0) {
                    ghostVal.innerText = formatMsToTime(requiredMs, false);
                    ghostBox.style.display = 'block';
                    return;
                }
            }
            ghostBox.style.display = 'none';
        }

        function resetCalculator() {
            playResetSound();
            document.getElementById('lap1').value = '';
            document.getElementById('lap2').value = '';
            document.getElementById('totalTime').value = '';
            document.getElementById('targetTime').value = '';
            document.getElementById('trackSelect').value = '';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('resultTime').innerText = '--.---';
            document.getElementById('comparisonDiff').innerText = '';
            document.getElementById('copyBtn').style.display = 'none';
            document.getElementById('ghostPaceBox').style.display = 'none';
            lastCalculatedString = "";
        }

        function copySplits() {
            if (!lastCalculatedString) return;
            playCopySound();
            navigator.clipboard.writeText(lastCalculatedString).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Copied!";
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                }, 2000);
            });
        }

        function calculateLap3() {
            playCalcSound();
            const l1Input = document.getElementById('lap1').value.trim();
            const l2Input = document.getElementById('lap2').value.trim();
            const totInput = document.getElementById('totalTime').value.trim();
            const targetInput = document.getElementById('targetTime').value;
            const errBox = document.getElementById('errorMessage');
            const resBox = document.getElementById('resultTime');
            const diffBox = document.getElementById('comparisonDiff');
            const copyBtn = document.getElementById('copyBtn');

            errBox.style.display = 'none';
            resBox.innerText = '--.---';
            resBox.style.color = 'var(--red)';
            diffBox.innerText = '';
            copyBtn.style.display = 'none';

            const l1 = parseTimeToMs(l1Input);
            const l2 = parseTimeToMs(l2Input);
            const total = parseTimeToMs(totInput);

            if (isNaN(l1) || isNaN(l2) || isNaN(total)) {
                errBox.innerText = "Please enter valid times for all fields.";
                errBox.style.display = 'block';
                return;
            }

            const l3 = total - (l1 + l2);

            if (l3 < 0) {
                errBox.innerText = "Error: Lap 1 + Lap 2 is greater than the Total Time!";
                errBox.style.display = 'block';
                resBox.innerText = "ERROR";
                return;
            }

            const formattedL3 = formatMsToTime(l3, false);
            resBox.innerText = formattedL3;
            
            lastCalculatedString = `${l1Input} - ${l2Input} - ${formattedL3}`;
            copyBtn.style.display = 'block';

            if (targetInput.trim() !== "") {
                const targetTotal = parseTimeToMs(targetInput);
                if (!isNaN(targetTotal)) {
                    const diff = total - targetTotal;
                    const absDiff = Math.abs(diff);
                    const formattedDiff = formatMsToTime(absDiff, true);

                    if (diff < 0) {
                        diffBox.style.color = '#28a745';
                        diffBox.innerText = `-${formattedDiff} ahead of target total`;
                    } else if (diff > 0) {
                        diffBox.style.color = 'var(--red)';
                        diffBox.innerText = `+${formattedDiff} behind target total`;
                    } else {
                        diffBox.style.color = '#555';
                        diffBox.innerText = `Exact match with target total!`;
                    }
                }
            }

            updateGhostPace();
        }

        const lap1Input = document.getElementById('lap1');
        lap1Input.addEventListener('input', function(e) {
            if (e.inputType === 'deleteContentBackward') return;
            let val = this.value.replace(/[.:]/g, '');
            if (val.length > 2) {
                this.value = val.substring(0, 2) + '.' + val.substring(2);
            } else {
                this.value = val;
            }
            updateGhostPace();
        });

        const lap2Input = document.getElementById('lap2');
        lap2Input.addEventListener('input', function(e) {
            if (e.inputType === 'deleteContentBackward') return;
            let val = this.value.replace(/[.:]/g, '');
            if (val.length > 2) {
                this.value = val.substring(0, 2) + '.' + val.substring(2);
            } else {
                this.value = val;
            }
            updateGhostPace();
        });

        const totalTimeInput = document.getElementById('totalTime');
        totalTimeInput.addEventListener('input', function(e) {
            if (e.inputType === 'deleteContentBackward') return;
            let val = this.value.replace(/[:.]/g, '');
            if (val.length > 0) {
                let min = val.substring(0, 1);
                let rest = val.substring(1);
                if (rest.length > 2) {
                    rest = rest.substring(0, 2) + '.' + rest.substring(2);
                }
                this.value = min + ':' + rest;
            } else {
                this.value = '';
            }
        });

        const targetTimeInput = document.getElementById('targetTime');
        targetTimeInput.addEventListener('input', function(e) {
            if (e.inputType === 'deleteContentBackward') return;
            let val = this.value.replace(/[:.]/g, '');
            if (val.length > 0) {
                let min = val.substring(0, 1);
                let rest = val.substring(1);
                if (rest.length > 2) {
                    rest = rest.substring(0, 2) + '.' + rest.substring(2);
                }
                this.value = min + ':' + rest;
            } else {
                this.value = '';
            }
            updateGhostPace();
        });
        
        document.querySelectorAll('input').forEach(i => {
            i.addEventListener('keypress', e => {
                if (e.key === 'Enter') {
                    calculateLap3();
                }
            });
        });

        function liveUpdate(){
            const a=document.getElementById('lap1').value.trim();
            const b=document.getElementById('lap2').value.trim();
            const c=document.getElementById('totalTime').value.trim();
            const timeFormat = /^\d:\d{2}\.\d{3}$/;
            
            if(a && b && timeFormat.test(c)){
                calculateLap3();
            }
        }
        
        ['lap1','lap2','totalTime','targetTime'].forEach(id=>{
            document.getElementById(id).addEventListener('input',liveUpdate);
        });

        const themeBtn = document.getElementById('themeToggle');
        function applyTheme(){
            const dark = localStorage.getItem('theme') === 'dark';
            document.body.classList.toggle('dark', dark);
            themeBtn.textContent = dark ? '☀️' : '🌙';
        }
        themeBtn.addEventListener('click', () => {
            const dark = document.body.classList.contains('dark');
            localStorage.setItem('theme', dark ? 'light' : 'dark');
            applyTheme();
        });

        const bgMusic = document.getElementById('bgMusic');
        const muteBtn = document.getElementById('muteToggle');
        bgMusic.volume = 0.5;

        function updateMuteButtonUI() {
            muteBtn.textContent = bgMusic.muted ? '🔇' : '🔊';
        }

        muteBtn.addEventListener('click', () => {
            bgMusic.muted = !bgMusic.muted;
            updateMuteButtonUI();
        });

        window.onload = function() {
            applyTheme();
            resetCalculator();
            updateMuteButtonUI();
            bgMusic.play().catch(e => {
                const unlockAudio = () => {
                    bgMusic.play();
                    window.removeEventListener('click', unlockAudio);
                    window.removeEventListener('keydown', unlockAudio);
                };
                window.addEventListener('click', unlockAudio);
                window.addEventListener('keydown', unlockAudio);
            });
        };
    </script>
</body>
</html>
