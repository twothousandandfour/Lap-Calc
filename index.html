<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Kart Lap Calculator</title>
    <style>
        :root {
            --red: #E3001B;
            --blue: #0047BB;
            --card-bg: #ffffff;
            --text-dark: #333333;
        }

        body {
            font-family: 'Stencil', 'Impact', Charcoal, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            
            background-color: #ffffff;
            background-image: 
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000),
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-dark);
        }

        .header-logo {
            max-width: 400px;
            width: 100%;
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.5));
            z-index: 10;
        }

        .calculator-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
            border-top: 6px solid var(--red);
            border-bottom: 6px solid var(--blue);
            z-index: 10;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: var(--text-dark);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.4em;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 6px;
            font-size: 1.1em;
            box-sizing: border-box;
            font-family: 'Stencil', monospace;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--blue);
        }

        .format-hint {
            font-size: 0.75em;
            color: #888;
            margin-top: 4px;
            display: block;
            font-family: sans-serif;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s;
            margin-top: 10px;
            font-family: 'Stencil', 'Impact', sans-serif;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: #003691;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 6px;
            text-align: center;
            border: 2px dashed #ccc;
        }

        .result-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .result-time {
            font-size: 2.2em;
            font-weight: bold;
            color: var(--red);
            font-family: 'Stencil', monospace;
        }

        .error {
            color: var(--red);
            font-size: 0.9em;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <img src="image.png" alt="Mario Kart World Logo" class="header-logo">

    <div class="calculator-card">
        <h2>Lap 3 Split Calc</h2>
        
        <div class="input-group">
            <label for="lap1">Lap 1 Time</label>
            <input type="text" inputmode="decimal" id="lap1" placeholder="49.930" autocomplete="off">
            <span class="format-hint">Format: M:SS.XXX</span>
        </div>

        <div class="input-group">
            <label for="lap2">Lap 2 Time</label>
            <input type="text" inputmode="decimal" id="lap2" placeholder="48.800" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="totalTime">Total Final Time</label>
            <input type="text" inputmode="decimal" id="totalTime" placeholder="2:27.420" autocomplete="off">
        </div>

        <button onclick="calculateLap3()">Calculate Lap 3</button>
        <div id="errorMessage" class="error">Please enter valid times for all fields.</div>

        <div class="result-box">
            <div class="result-label">Your Lap 3 Split</div>
            <div class="result-time" id="resultTime">--.---</div>
        </div>
    </div>

    <script>
        function parseTimeToMs(t) {
            t = t.trim();
            if (!t) return NaN;

            let m = 0;
            let rest = t;

            if (t.includes(':')) {
                const p = t.split(':');
                m = parseInt(p[0], 10);
                rest = p[1];
            }

            let s = 0;
            let ms = 0;
            
            if (rest.includes('.')) {
                const sp = rest.split('.');
                s = parseInt(sp[0], 10);
                
                let msText = sp[1];
                while(msText.length < 3) msText += '0';
                msText = msText.substring(0, 3);
                
                ms = parseInt(msText, 10);
            } else {
                s = parseInt(rest, 10);
            }

            if (isNaN(m) || isNaN(s) || isNaN(ms)) return NaN;

            return (m * 60 * 1000) + (s * 1000) + ms;
        }

        function formatMsToTime(msTotal) {
            if (msTotal < 0) return "Invalid (Negative)";
            
            const m = Math.floor(msTotal / 60000);
            const rem = msTotal % 60000;
            const s = Math.floor(rem / 1000);
            const ms = rem % 1000;

            const sPad = s.toString().padStart(2, '0');
            const msPad = ms.toString().padStart(3, '0');

            if (m > 0) {
                return `${m}:${sPad}.${msPad}`;
            } else {
                return `${s}.${msPad}`; 
            }
        }

        function calculateLap3() {
            const l1Input = document.getElementById('lap1').value;
            const l2Input = document.getElementById('lap2').value;
            const totInput = document.getElementById('totalTime').value;
            const errBox = document.getElementById('errorMessage');
            const resBox = document.getElementById('resultTime');

            errBox.style.display = 'none';
            resBox.innerText = '--.---';
            resBox.style.color = 'var(--red)';

            const l1 = parseTimeToMs(l1Input);
            const l2 = parseTimeToMs(l2Input);
            const total = parseTimeToMs(totInput);

            if (isNaN(l1) || isNaN(l2) || isNaN(total)) {
                errBox.innerText = "Please enter valid times (e.g., 2:27.420)";
                errBox.style.display = 'block';
                return;
            }

            const l3 = total - (l1 + l2);

            if (l3 < 0) {
                errBox.innerText = "Error: Lap 1 + Lap 2 is greater than the Total Time!";
                errBox.style.display = 'block';
                resBox.innerText = "ERROR";
                return;
            }

            resBox.innerText = formatMsToTime(l3);
        }

        const totalTimeInput = document.getElementById('totalTime');

        totalTimeInput.addEventListener('input', function(e) {
            if (e.inputType === 'deleteContentBackward') return;
            
            let val = this.value.replace(/:/g, '');
            if (val.length > 0) {
                this.value = val.substring(0, 1) + ':' + val.substring(1);
            }
        });
        
        document.querySelectorAll('input').forEach(i => {
            i.addEventListener('keypress', e => {
                if (e.key === 'Enter') calculateLap3();
            });
        });
    </script>
</body>
</html>
