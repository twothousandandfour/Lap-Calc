<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Kart Lap Calculator</title>
    <style>
        :root {
            --mario-red: #E3001B;
            --mario-blue: #0047BB;
            --card-bg: #ffffff;
            --text-dark: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            
            /* High-contrast checkered background */
            background-color: #ffffff;
            background-image: 
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000),
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-dark);
        }

        .header-logo {
            max-width: 400px;
            width: 100%;
            height: auto;
            margin-bottom: 30px;
            /* Adds a slight shadow to help it pop off the checkered background */
            filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.5));
            z-index: 10;
        }

        .calculator-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
            border-top: 6px solid var(--mario-red);
            border-bottom: 6px solid var(--mario-blue);
            z-index: 10;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: var(--text-dark);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.4em;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 6px;
            font-size: 1.1em;
            box-sizing: border-box;
            font-family: monospace;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--mario-blue);
        }

        .format-hint {
            font-size: 0.75em;
            color: #888;
            margin-top: 4px;
            display: block;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--mario-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #003691;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 6px;
            text-align: center;
            border: 2px dashed #ccc;
        }

        .result-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .result-time {
            font-size: 2.2em;
            font-weight: bold;
            color: var(--mario-red);
            font-family: monospace;
        }

        .error {
            color: var(--mario-red);
            font-size: 0.9em;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Logo placed outside the card, centered at the top -->
    <img src="image.png" alt="Mario Kart World Logo" class="header-logo">

    <div class="calculator-card">
        <h2>Lap 3 Split Calc</h2>
        
        <div class="input-group">
            <label for="lap1">Lap 1 Time</label>
            <input type="text" id="lap1" placeholder="1:05.123" autocomplete="off">
            <span class="format-hint">Format: M:SS.xxx (e.g., 1:05.234 or 45.123)</span>
        </div>

        <div class="input-group">
            <label for="lap2">Lap 2 Time</label>
            <input type="text" id="lap2" placeholder="1:03.456" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="totalTime">Total Final Time</label>
            <input type="text" id="totalTime" placeholder="3:10.987" autocomplete="off">
        </div>

        <button onclick="calculateLap3()">Calculate Lap 3</button>
        <div id="errorMessage" class="error">Please enter valid times for all fields.</div>

        <div class="result-box">
            <div class="result-label">Your Lap 3 Split</div>
            <div class="result-time" id="resultTime">--:--.---</div>
        </div>
    </div>

    <script>
        function parseTimeToMs(timeStr) {
            timeStr = timeStr.trim();
            if (!timeStr) return NaN;

            let mins = 0;
            let secsAndMs = timeStr;

            if (timeStr.includes(':')) {
                const parts = timeStr.split(':');
                mins = parseInt(parts[0], 10);
                secsAndMs = parts[1];
            }

            let secs = 0;
            let ms = 0;
            
            if (secsAndMs.includes('.')) {
                const secParts = secsAndMs.split('.');
                secs = parseInt(secParts[0], 10);
                
                let msStr = secParts[1];
                while(msStr.length < 3) msStr += '0';
                msStr = msStr.substring(0, 3);
                
                ms = parseInt(msStr, 10);
            } else {
                secs = parseInt(secsAndMs, 10);
            }

            if (isNaN(mins) || isNaN(secs) || isNaN(ms)) return NaN;

            return (mins * 60 * 1000) + (secs * 1000) + ms;
        }

        function formatMsToTime(totalMs) {
            if (totalMs < 0) return "Invalid (Negative)";
            
            const mins = Math.floor(totalMs / 60000);
            const remainingMsAfterMins = totalMs % 60000;
            const secs = Math.floor(remainingMsAfterMins / 1000);
            const ms = remainingMsAfterMins % 1000;

            const paddedSecs = secs.toString().padStart(2, '0');
            const paddedMs = ms.toString().padStart(3, '0');

            if (mins > 0) {
                return `${mins}:${paddedSecs}.${paddedMs}`;
            } else {
                return `${secs}.${paddedMs}`; 
            }
        }

        function calculateLap3() {
            const lap1Str = document.getElementById('lap1').value;
            const lap2Str = document.getElementById('lap2').value;
            const totalStr = document.getElementById('totalTime').value;
            const errorDiv = document.getElementById('errorMessage');
            const resultDiv = document.getElementById('resultTime');

            errorDiv.style.display = 'none';
            resultDiv.innerText = '--:--.---';
            resultDiv.style.color = 'var(--mario-red)';

            const lap1Ms = parseTimeToMs(lap1Str);
            const lap2Ms = parseTimeToMs(lap2Str);
            const totalMs = parseTimeToMs(totalStr);

            if (isNaN(lap1Ms) || isNaN(lap2Ms) || isNaN(totalMs)) {
                errorDiv.innerText = "Please enter valid times (e.g., 1:23.456)";
                errorDiv.style.display = 'block';
                return;
            }

            const lap3Ms = totalMs - (lap1Ms + lap2Ms);

            if (lap3Ms < 0) {
                errorDiv.innerText = "Error: Lap 1 + Lap 2 is greater than the Total Time!";
                errorDiv.style.display = 'block';
                resultDiv.innerText = "ERROR";
                return;
            }

            resultDiv.innerText = formatMsToTime(lap3Ms);
        }
        
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    calculateLap3();
                }
            });
        });
    </script>
</body>
</html>
